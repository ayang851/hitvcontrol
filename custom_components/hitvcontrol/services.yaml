# ─────────────────────────────────────────────────────────────────────────────
# HiTVControl 集成 · 服务元数据定义 (services.yaml) --调试工具使用该文件
# ─────────────────────────────────────────────────────────────────────────────
#
# 【文件作用】
#   本文件由 Home Assistant 框架在**启动时自动加载**,无需在 Python 中
#   import / read。它本身**不包含任何业务逻辑**,仅作为元数据为前端
#   "开发者工具 → 动作"页面提供:
#     · 服务的展示名 (name)
#     · 服务的描述文案 (description)
#     · 字段的名称、说明、示例值
#     · 字段的 UI 选择器 (selector: text / select / number …)
#     · 字段是否必填 (required)
#
# 【加载机制】
#   框架在加载 custom_components/<domain>/ 时,会自动扫根目录下的
#   services.yaml,将其内容合并到该域名的服务注册表里。
#   但 YAML **只描述"服务长什么样"**,不描述"服务被调用时该干啥"。
#   真正的执行 handler 必须由 Python 通过
#       hass.services.async_register(DOMAIN, name, handler, schema=...)
#   注册到 HA 服务总线。本项目的实际 handler 在 __init__.py 中。
#
# 【命名约束(强约定,不可改)】
#   · 文件名固定为 services.yaml,小写、下划线分隔
#   · 必须放在 custom_components/<domain>/ 根目录
#   · 改名后框架不再识别(不会报错,等同于该文件不存在)
#   · 顶层 key 即服务名,需与 async_register 的第二参数完全一致
#
# 【当前状态】
#   · 本文件 YAML 内容会在"开发者工具 → 动作"页面下展示为四项：
#     hitvcontrol.send_command / send_text_command / launch_app / refresh_apps。
#   · 字段校验已在 __init__.py 的 async_register 传入 schema（以 Python 侧为准），
#     这里只负责 UI 展示的文案与选择器。
# ─────────────────────────────────────────────────────────────────────────────

# 顶层 key:服务名。需与 hass.services.async_register 的第二参数对齐。
# 完整服务 ID 在前端呈现为 "hitvcontrol.send_command"。
send_command:
  # 服务的展示名:显示在"开发者工具 → 动作"页面顶部 + 文档页 H1
  name: Send Command to TV

  # 服务的详细说明:UI 中是悬停 tooltip,同时被开发者文档自动抓取
  # 注意:括号内容用全角圆括号,HA 翻译系统会按字符串原样渲染
  description: 通过 MQTT 向指定电视发送按键指令（payload 为按键名称字符串）

  # 服务的入参列表。每个 key 就是一个字段,对应前端表单的一行
  fields:

    # ─── 字段 1:目标电视 ───────────────────────────────────────────────
    # 用途:在 hass.data[DOMAIN] 中查找对应的 config entry
    # 匹配逻辑见 __init__.py 中 _find_entry_data 的两次 for 循环:
    #   1. 先按 device_id 精确匹配
    #   2. 未命中再按 entity_id 匹配
    # 保持 text 输入（曾经试用 entity 下拉，实际体验差：
    #   dropdown 会展开覆盖下方字段，且同一台电视会同时列出
    #   remote.xxx 与 media_player.xxx 两个同名条目，难以区分）。
    # 两种写法都接受，用户从中前端状态页/日志里复制哪个都行。
    device_id:
      # 字段的展示名(前端 label)
      name: Device ID
      # 字段的说明:说明两种格式都支持,举例避免拼错
      description: 目标电视的 device_id 或 entity_id（从状态页或日志中复制即可）
      # 是否必填:为 true 时,调用时若缺此字段,HA 直接拒绝并报错
      required: true
      # 示例值:entity_id 比 32 位 device_id 更好记，作为默认示例
      example: "media_player.ke_ting_dian_shi"
      # UI 选择器:text 表示渲染为单行文本输入框
      selector:
        text:

    # ─── 字段 2:要发送的按键名称 ──────────────────────────────────────
    # 用途:payload 直接为按键名称字符串(无 JSON 包装),通过 MQTT
    # publish 到 /remoteapp/tv/hiservice_cmd/{device_id}/actions/sendkey
    # 合法取值见 const.py 中的 KEY_* 常量(KEY_POWER / KEY_OK / KEY_MUTE …)
    command:
      # 字段的展示名
      name: Command
      # 字段的说明,括号里举两个最常用的按键名作为示例
      description: 要发送的按键名称（如 KEY_OK、KEY_POWER）
      # 必填:发空字符串会触发 mqtt publish 一个空 payload,电视端不响应
      required: true
      # 示例值:KEY_OK 是最常用的"确认"键
      example: "KEY_OK"
      # UI 选择器:text 单行文本
      # 进阶用法:可改成 select + options 列表,前端渲染为下拉框,
      # 强约束用户只能选 const.py 中已定义的 KEY_*,避免拼错
      selector:
        text:

# ─────────────────────────────────────────────────────────────────────────────
# send_text_command:发送文本控制指令到电视
#   MQTT: /remoteapp/tv/homelink_cmd/{device_id}/actions/voice_text
#   payload: 任意文本字符串（如 JSON、自定义协议报文），电视端接收后自定义解析
# ─────────────────────────────────────────────────────────────────────────────
send_text_command:
  name: Send Text Command to TV
  description: 通过 MQTT 向指定电视发送文本控制指令（payload 为任意文本字符串，电视端自定义解析）
  fields:
    device_id:
      name: Device ID
      description: 目标电视的 device_id 或 entity_id（从状态页或日志中复制即可）
      required: true
      example: "media_player.ke_ting_dian_shi"
      selector:
        text:
    text:
      name: Text
      description: 要发送的文本内容（如 JSON、自定义协议报文等）
      required: true
      example: '{"action":"open_settings"}'
      selector:
        text:

# ─────────────────────────────────────────────────────────────────────────────
# launch_app:启动电视上的应用
#   MQTT: /remoteapp/tv/homelink/actions/launchapp
#   payload: {"type": "package" | "uri", "id": "<包名或深链>"}
#   type=package → 电视端 getLaunchIntentForPackage(id)
#   type=uri     → 电视端 ACTION_VIEW + Uri.parse(id)
# ─────────────────────────────────────────────────────────────────────────────
launch_app:
  name: Launch App
  description: 在指定电视上启动应用（app_id 可填应用名、包名或深链；启动方式默认 auto）
  fields:
    device_id:
      name: Device ID
      description: 目标电视的 device_id 或 entity_id（从状态页或日志中复制即可）
      required: true
      example: "media_player.ke_ting_dian_shi"
      # 文本输入:同 send_command，不用 entity 下拉（会遮挡下方字段）
      selector:
        text:
    app_id:
      name: App
      # 注：应用列表是电视实时上报的，服务 schema 只能写静态 options，
      # 因此这里无法做“下拉选应用”。要下拉选应用请用：
      #   · 媒体播放器实体的 source 下拉（media_player。select_source）；
      #   · 仪表盘里的应用宫格（点图标就直接 launchapp）。
      # 这里手填应用名/包名/深链，auto 模式下会先按应用名匹配包名。
      description: 应用名（如爱奇艺）、包名（com.qiyi.video）或深链（qiyi://xxx）
      required: true
      example: "com.qiyi.video"
      selector:
        text:
    # 启动方式（launch_type）故意不在 UI 暴露：
    #   后端 SCHEMA_LAUNCH_APP 已写 vol.Optional(default="auto")，
    #   不传就是 auto（先匹配应用名→含 "://" 视为深链→否则当包名）。
    #   以前这里放一个下拉框，用户还得判断选哪个；实际 99% 场景都是 auto。
    # 需要强制 type=uri / package 时仍可写（服务校验以 Python schema 为准，
    # 不依赖本文件的字段声明）：
    #   data: {device_id: media_player.xxx, app_id: "qiyi://xxx", launch_type: uri}
    # 若要恢复 UI 下拉框，把下面这段放回 fields 即可：
    #   launch_type:
    #     name: Launch Type
    #     required: true
    #     default: "auto"
    #     selector: { select: { mode: dropdown, options: [auto, package, uri] } }

# ─────────────────────────────────────────────────────────────────────────────
# refresh_apps:重新拉取电视应用列表
#   MQTT: HA 发布 /remoteapp/tv/homelink/actions/getapps
#         电视回推 /remoteapp/mobile/homelink/apps
# ─────────────────────────────────────────────────────────────────────────────
refresh_apps:
  name: Refresh Apps
  description: 重新向电视请求应用列表（会重写仪表盘里的应用宫格）
  fields:
    device_id:
      name: Device ID
      description: 目标电视的 device_id 或 entity_id（从状态页或日志中复制即可）
      required: true
      example: "media_player.ke_ting_dian_shi"
      # 文本输入:同上
      selector:
        text:
